name: Build and Deploy

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: git.rodydavis.dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}

      - name: Set up Flutter
        uses: https://git.rodydavis.dev/rodydavis/shared-actions/setup-flutter@main
        with:
          version: 4ebf37fe7df0a130ba5bee17315b98f905c10b34
          git_token: ${{ secrets.GIT_TOKEN }}

      - name: Install dependencies
        run: flutter pub upgrade lucide_icons_flutter && flutter pub get

      - name: Build Runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Web
        run: flutter build web --base-href /web/ --wasm

      - name: Build CLI Server
        run: dart build cli -o build/server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.GIT_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ gitea.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to TrueNAS
        uses: https://git.rodydavis.dev/rodydavis/shared-actions/truenas-deploy@main
        with:
          ssh_key: ${{ secrets.TRUENAS_SSH_KEY }}
          app_name: pocket-piano
